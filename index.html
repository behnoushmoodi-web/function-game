<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آزمایشگاه کسرها</title>

<style>

body {
  font-family: Tahoma, sans-serif;
  background: #fff8e9;
  text-align: center;
  padding: 15px;
  color: #35445c;
  margin: 0;
}

/* صفحه شروع */

.home-box {
  background: linear-gradient(135deg,#315c81,#55a6a0);
  color: white;
  padding: 45px 20px;
  border-radius: 24px;
  max-width: 500px;
  margin: 80px auto;
  box-shadow: 0 8px 25px #b9cbd0;
}

.home-box h1 {
  color: white;
  font-size: 23px;
  margin: 10px 0 25px;
}

/* سربرگ بازی */

.game-header {
  background: linear-gradient(135deg,#315c81,#55a6a0);
  color: white;
  padding: 15px 12px 8px;
  border-radius: 20px;
  max-width: 500px;
  margin: 15px auto 20px;
  box-shadow: 0 8px 25px #b9cbd0;
}

.game-header .small-title {
  font-size: 9px;
  opacity: .9;
}

.game-header h1 {
  color: white;
  font-size: 16px;
  margin: 10px 0;
}

.game-header .description {
  font-size: 10px;
  margin: 5px 0;
}

.game-header .emoji {
  font-size: 15px;
  margin: 5px 0;
}

.signature {
  font-size: 8px;
  line-height: 1.8;
  margin-top: 8px;
}

/* کارت بازی */

.card {
  background: white;
  border-radius: 20px;
  padding: 20px 10px;
  margin: 15px auto;
  max-width: 500px;
  box-shadow: 0 4px 15px #ddd;
}

.fractions {
  display: flex;
  justify-content: space-around;
  gap: 10px;
}

.fraction {
  background: #f0f5fa;
  border-radius: 15px;
  padding: 12px 5px;
  width: 45%;
}

.number {
  font-size: 23px;
  font-weight: bold;
}

button {
  border: none;
  border-radius: 12px;
  padding: 11px 17px;
  margin: 8px;
  font-size: 15px;
  cursor: pointer;
  background: #e5b85c;
  color: #333;
  font-family: Tahoma, sans-serif;
}

button:hover {
  background: #f0ce85;
}

.shape {
  display: flex;
  height: 35px;
  margin: 15px auto;
  direction: ltr;
}

.part {
  border: 1px solid white;
  background: #d9e3ed;
  flex: 1;
}

.filled {
  background: #55a6a0;
}

#message {
  font-size: 15px;
  font-weight: bold;
  margin: 15px;
  min-height: 25px;
}

.home-button {
  background: #dce9ef;
  font-size: 12px;
}

/* نمایش در گوشی */

@media (max-width: 400px) {
  body {
    padding: 10px;
  }

  .card {
    padding: 15px 5px;
  }

  .number {
    font-size: 21px;
  }

  button {
    font-size: 13px;
    padding: 10px 12px;
  }
}

</style>
</head>

<body>

<!-- صفحه اصلی -->

<div id="homeScreen" class="home-box">

  <h1>آزمایشگاه کسرها</h1>

  <button onclick="showGame()">
    شروع بازی 🚀
  </button>

</div>


<!-- سربرگ بازی -->

<div id="gameHeader" class="game-header" style="display:none;">

  <div class="small-title">
    ✦ محیط تعاملی یادگیری ریاضی | پایه پنجم ✦
  </div>

  <h1>آزمایشگاه کسرها</h1>

  <div class="description">
    کشف دنیای کسرها با بازی، تجربه و تفکر
  </div>

  <div class="emoji">
    🧩 🔢 🎨
  </div>

  <div class="signature">
    بهنوش مودی<br>
    گروه تخصصی آموزگاران پایه پنجم رضویه
  </div>

</div>


<!-- محیط بازی -->

<div id="gameScreen" style="display:none;">

  <div class="card">

    <div class="fractions">

      <div class="fraction">

        <div id="fraction1" class="number"></div>

        <div id="shape1" class="shape"></div>

        <button onclick="check(1)">
          کسر اول
        </button>

      </div>


      <div class="fraction">

        <div id="fraction2" class="number"></div>

        <div id="shape2" class="shape"></div>

        <button onclick="check(2)">
          کسر دوم
        </button>

      </div>

    </div>

    <div id="message"></div>

    <button onclick="newQuestion()">
      سؤال بعدی 🔄
    </button>

    <br>

    <button class="home-button" onclick="showHome()">
      بازگشت به صفحه اصلی
    </button>

  </div>

</div>


<script>

let a, b, c, d;


/* ساخت کسر تصادفی */

function makeFraction() {

  let denominator = Math.floor(Math.random() * 7) + 3;

  let numerator = Math.floor(
    Math.random() * (denominator - 1)
  ) + 1;

  return [numerator, denominator];

}


/* رسم شکل کسر */

function drawShape(id, n, d) {

  let box = document.getElementById(id);

  box.innerHTML = "";

  for(let i = 0; i < d; i++) {

    let part = document.createElement("div");

    part.className = "part" + (i < n ? " filled" : "");

    box.appendChild(part);

  }

}


/* تولید سؤال جدید */

function newQuestion() {

  do {

    [a,b] = makeFraction();

    [c,d] = makeFraction();

  } while(a/b === c/d);


  document.getElementById("fraction1").innerHTML =
    a + "<hr>" + b;

  document.getElementById("fraction2").innerHTML =
    c + "<hr>" + d;


  drawShape("shape1", a, b);

  drawShape("shape2", c, d);


  document.getElementById("message").innerHTML = "";

}


/* بررسی پاسخ */

function check(choice) {

  let correct = a/b > c/d ? 1 : 2;

  document.getElementById("message").innerHTML =

    choice === correct
    ? "🌟 آفرین! پاسخ درست است."
    : "دوباره فکر کن! پاسخ درست نیست.";

}


/* ورود به بازی */

function showGame() {

  document.getElementById("homeScreen").style.display = "none";

  document.getElementById("gameHeader").style.display = "block";

  document.getElementById("gameScreen").style.display = "block";

  newQuestion();

}


/* بازگشت به صفحه اصلی */

function showHome() {

  document.getElementById("homeScreen").style.display = "block";

  document.getElementById("gameHeader").style.display = "none";

  document.getElementById("gameScreen").style.display = "none";

}

</script>

</body>
</html>
