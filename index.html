<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمایشگاه کسرها</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:12px;
  font-family:Tahoma,sans-serif;
  background:#fff8e9;
  color:#35445c;
  text-align:center;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 17px;
  margin:5px;
  font-family:inherit;
  font-size:13px;
  cursor:pointer;
  background:#e5b85c;
  color:#35445c;
}

button:active{transform:scale(.97)}
button:disabled{opacity:.7;cursor:not-allowed}

.home-box,.card{
  max-width:600px;
  margin:18px auto;
  padding:20px;
  background:white;
  border-radius:20px;
  box-shadow:0 4px 15px #ddd;
}

.home-box{
  margin-top:65px;
  padding:35px 18px;
  background:linear-gradient(135deg,#315c81,#55a6a0);
  color:white;
}

.home-box h1{
  color:white;
  font-size:22px;
  margin:15px 0 8px;
}

.credit{
  font-size:12px;
  line-height:2.5;
  margin:12px 0 22px;
  color:white;
}

#menuScreen h3{
  font-size:16px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
  margin:12px auto;
}

.stat{
  background:#f0f5fa;
  padding:9px 13px;
  border-radius:12px;
  font-size:12px;
}

.stage-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.stage-btn{
  min-height:80px;
  background:#f0f5fa;
  border:2px solid #e3edf2;
  font-size:12px;
  line-height:2;
}

.stage-btn span{
  display:block;
  font-size:22px;
}

#stageName{
  font-size:16px;
  color:#315c81;
}

#questionTitle{
  font-size:14px;
  color:#315c81;
  margin:12px 0 18px;
  line-height:2;
}

#question{
  font-size:18px;
  font-weight:bold;
  line-height:2.2;
  margin:15px 0;
}

.fractions{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  margin:15px 0;
}

.fraction-card{
  background:#f0f5fa;
  border-radius:15px;
  padding:13px;
  min-width:110px;
}

.fraction{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  vertical-align:middle;
  font-size:17px;
  font-weight:bold;
  min-width:28px;
  line-height:1.5;
  margin:0 4px;
}

.fraction .line{
  width:100%;
  min-width:25px;
  height:2px;
  background:#35445c;
  margin:2px 0;
}

.shape{
  display:flex;
  direction:ltr;
  height:25px;
  margin:12px auto 5px;
  max-width:180px;
}

.part{
  flex:1;
  border:1px solid white;
  background:#d9e3ed;
}

.filled{background:#55a6a0}

.options{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:18px 0;
}

.option{
  background:#eaf1f6;
  min-width:75px;
  border:2px solid #d9e3ed;
  font-size:14px;
}

.option.correct{
  background:#d8f2e3;
  border-color:#55a878;
}

.option.wrong{
  background:#ffe0dc;
  border-color:#dc8175;
}

#message{
  font-size:13px;
  font-weight:bold;
  margin:15px 0;
  line-height:2;
}

.explanation{
  display:none;
  text-align:right;
  background:#fff8e9;
  border-right:4px solid #e5b85c;
  border-radius:12px;
  padding:14px;
  margin:15px 0;
  font-size:12px;
  line-height:2.3;
}

.explanation h3{
  color:#315c81;
  margin:0 0 8px;
  font-size:14px;
}

.explanation .step{
  margin:5px 0;
}

.explanation .answer{
  background:#e0f1ee;
  padding:8px;
  border-radius:9px;
  margin-top:10px;
  font-weight:bold;
}

.progress{
  height:7px;
  background:#e9edf1;
  border-radius:10px;
  overflow:hidden;
  margin:13px 0;
}

#progressBar{
  height:100%;
  width:0%;
  background:#55a6a0;
  transition:.3s;
}

.hidden{display:none!important}
.secondary{background:#d9e3ed}

@media(max-width:400px){
  body{padding:8px}
  .home-box,.card{padding:14px}
  .stage-grid{gap:7px}
  .stage-btn{font-size:11px}
  #question{font-size:16px}
  .fraction-card{min-width:95px}
}
</style>
</head>

<body>

<!-- صفحه آغازین؛ مشخصات فقط در همین صفحه هستند -->
<div id="homeScreen" class="home-box">
  <div style="font-size:35px">🧩 🔢 🎨</div>

  <h1>آزمایشگاه کسرها</h1>

  <div class="credit">
    بهنوش مودی
    <br>
    گروه تخصصی آموزشگران پایه پنجم رضویه
  </div>

  <button onclick="showMenu()" style="font-weight:bold">
    شروع بازی 🚀
  </button>
</div>

<!-- منوی مراحل -->
<div id="menuScreen" class="card hidden">

  <h3>🌟 یک مرحله را انتخاب کن</h3>

  <div class="stats">
    <div class="stat">⭐ امتیاز: <b id="totalScore">۰</b></div>
    <div class="stat">✅ پاسخ درست: <b id="totalCorrect">۰</b></div>
  </div>

  <div class="stage-grid">

    <button class="stage-btn" onclick="startStage('compare')">
      <span>⚖️</span>
      مقایسه کسرها
    </button>

    <button class="stage-btn" onclick="startStage('equal')">
      <span>🟰</span>
      کسرهای مساوی
    </button>

    <button class="stage-btn" onclick="startStage('simplify')">
      <span>✂️</span>
      ساده کردن کسرها
    </button>

    <button class="stage-btn" onclick="startStage('add')">
      <span>➕</span>
      جمع کسرها
    </button>

    <button class="stage-btn" onclick="startStage('subtract')">
      <span>➖</span>
      تفریق کسرها
    </button>

  </div>

  <button class="secondary" onclick="showHome()">
    صفحه شروع
  </button>
</div>

<!-- صفحه بازی -->
<div id="gameScreen" class="card hidden">

  <h3 id="stageName"></h3>

  <div class="stats">
    <div class="stat">⭐ امتیاز: <b id="score">۰</b></div>
    <div class="stat">✅ درست: <b id="correctCount">۰</b></div>
    <div class="stat">📝 سؤال: <b id="questionCount">۱</b></div>
  </div>

  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <div id="questionTitle"></div>
  <div id="question"></div>
  <div id="visuals"></div>
  <div id="options" class="options"></div>

  <div id="message"></div>

  <div id="explanation" class="explanation">
    <h3>💡 چطور حل کردیم؟</h3>
    <div id="solution"></div>
  </div>

  <button id="nextBtn" class="hidden" onclick="newQuestion()">
    سؤال بعدی 🔄
  </button>

  <br>

  <button class="secondary" onclick="showMenu()">
    بازگشت به مراحل
  </button>

</div>

<script>

let totalScore=0;
let totalCorrect=0;

let stage="";
let stageQuestions=0;
let stageCorrect=0;
let answered=false;
let currentAnswer=null;

const names={
  compare:"مقایسه کسرها",
  equal:"کسرهای مساوی",
  simplify:"ساده کردن کسرها",
  add:"جمع کسرها",
  subtract:"تفریق کسرها"
};

const fa=n=>Number(n).toLocaleString("fa-IR");

function gcd(a,b){
  a=Math.abs(a);
  b=Math.abs(b);
  while(b){
    let t=b;
    b=a%b;
    a=t;
  }
  return a||1;
}

function simplify(n,d){
  let g=gcd(n,d);
  return [n/g,d/g];
}

function frac(n,d){
  return `<span class="fraction">
    <span>${fa(n)}</span>
    <span class="line"></span>
    <span>${fa(d)}</span>
  </span>`;
}

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function updateStats(){

  document.getElementById("totalScore").textContent=fa(totalScore);
  document.getElementById("totalCorrect").textContent=fa(totalCorrect);

  document.getElementById("score").textContent=fa(totalScore);
  document.getElementById("correctCount").textContent=fa(stageCorrect);
  document.getElementById("questionCount").textContent=fa(stageQuestions);

  document.getElementById("progressBar").style.width=
    Math.min(stageQuestions*10,100)+"%";
}

function hideAll(){
  ["homeScreen","menuScreen","gameScreen"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
}

function showHome(){
  hideAll();
  document.getElementById("homeScreen").classList.remove("hidden");
}

function showMenu(){
  hideAll();
  document.getElementById("menuScreen").classList.remove("hidden");
  updateStats();
}

function startStage(s){
  stage=s;
  stageQuestions=0;
  stageCorrect=0;

  hideAll();

  document.getElementById("gameScreen").classList.remove("hidden");
  document.getElementById("stageName").textContent=names[s];

  newQuestion();
}

function makeShape(n,d){
  let html="";
  for(let i=0;i<d;i++){
    html+=`<div class="part ${i<n?"filled":""}"></div>`;
  }
  return `<div class="shape">${html}</div>`;
}

function setQuestion(title,question,visuals=""){
  document.getElementById("questionTitle").textContent=title;
  document.getElementById("question").innerHTML=question;
  document.getElementById("visuals").innerHTML=visuals;
}

/* ساخت گزینه‌های کسری با جلوگیری از گزینه‌های هم‌ارز تکراری */
function makeFractionOptions(correct,explanation,extras=[]){

  let opts=[];
  let used=new Set();

  function addOption(n,d){
    if(!Number.isInteger(n)||!Number.isInteger(d)||d<=0||n<0)return;

    let s=simplify(n,d);
    let key=s[0]+"/"+s[1];

    if(!used.has(key)){
      used.add(key);
      opts.push([n,d]);
    }
  }

  addOption(correct[0],correct[1]);

  extras.forEach(x=>addOption(x[0],x[1]));

  let attempts=0;

  while(opts.length<4 && attempts<300){
    attempts++;
    addOption(rand(1,12),rand(2,12));
  }

  shuffle(opts);

  currentAnswer=simplify(correct[0],correct[1]).join("/");

  document.getElementById("options").innerHTML=
    opts.map(x=>`
      <button class="option" onclick="checkFractionAnswer(${x[0]},${x[1]},this)">
        ${frac(x[0],x[1])}
      </button>
    `).join("");

  prepareAnswer(explanation);
}

function prepareAnswer(explanation){

  document.getElementById("explanation").style.display="none";
  document.getElementById("solution").innerHTML=explanation;
  document.getElementById("message").innerHTML="";
  document.getElementById("nextBtn").classList.add("hidden");

  answered=false;
}

function checkFractionAnswer(n,d,btn){

  if(answered)return;
  answered=true;

  let result=simplify(n,d).join("/");
  finishAnswer(result===currentAnswer,btn);
}

function checkCompare(choice,btn){

  if(answered)return;
  answered=true;

  finishAnswer(choice===currentAnswer,btn);
}

function finishAnswer(correct,btn){

  if(correct){
    totalScore+=10;
    totalCorrect++;
    stageCorrect++;

    document.getElementById("message").innerHTML=
      "🌟 آفرین! پاسخ درست است. ۱۰ امتیاز گرفتی.";

    btn.classList.add("correct");

  }else{

    document.getElementById("message").innerHTML=
      "🌱 اشکالی ندارد! راه‌حل را با دقت بخوان و یاد بگیر.";

    btn.classList.add("wrong");
  }

  document.querySelectorAll(".option").forEach(b=>{
    b.disabled=true;
  });

  document.getElementById("explanation").style.display="block";
  document.getElementById("nextBtn").classList.remove("hidden");

  updateStats();
}

function newQuestion(){

  stageQuestions++;
  updateStats();

  document.getElementById("visuals").innerHTML="";
  document.getElementById("options").innerHTML="";
  document.getElementById("message").innerHTML="";
  document.getElementById("explanation").style.display="none";
  document.getElementById("nextBtn").classList.add("hidden");

  if(stage==="compare")questionCompare();
  if(stage==="equal")questionEqual();
  if(stage==="simplify")questionSimplify();
  if(stage==="add")questionArithmetic("add");
  if(stage==="subtract")questionArithmetic("subtract");
}

/* مرحله اول: مقایسه کسرها */

function questionCompare(){

  let a,b,c,d;

  do{
    b=rand(3,9);
    d=rand(3,9);
    a=rand(1,b-1);
    c=rand(1,d-1);
  }while(a*d===c*b);

  let correct=a*d>c*b?1:2;

  setQuestion(
    "کدام کسر بزرگ‌تر است؟",
    "به شکل‌ها و کسرها دقت کن و پاسخ درست را انتخاب کن.",
    `<div class="fractions">

      <div class="fraction-card">
        ${frac(a,b)}
        ${makeShape(a,b)}
        <small>کسر اول</small>
      </div>

      <div class="fraction-card">
        ${frac(c,d)}
        ${makeShape(c,d)}
        <small>کسر دوم</small>
      </div>

    </div>`
  );

  currentAnswer=correct;
  answered=false;

  document.getElementById("options").innerHTML=`
    <button class="option" onclick="checkCompare(1,this)">کسر اول</button>
    <button class="option" onclick="checkCompare(2,this)">کسر دوم</button>
  `;

  let x=a*d;
  let y=c*b;

  let solution=`
    <div class="step">
      برای مقایسه، صورت هر کسر را در مخرج کسر دیگر ضرب می‌کنیم.
    </div>

    <div class="step">
      کسر اول: ${fa(a)} × ${fa(d)} = <b>${fa(x)}</b>
    </div>

    <div class="step">
      کسر دوم: ${fa(c)} × ${fa(b)} = <b>${fa(y)}</b>
    </div>

    <div class="step">
      چون ${fa(x)} ${x>y?"بزرگ‌تر از":"کوچک‌تر از"} ${fa(y)} است،
      کسر ${correct===1?"اول":"دوم"} بزرگ‌تر است.
    </div>

    <div class="answer">
      پاسخ: کسر ${correct===1?"اول":"دوم"}
    </div>
  `;

  prepareAnswer(solution);
}

/* مرحله دوم: کسرهای مساوی */

function questionEqual(){

  let n=rand(1,5);
  let d=rand(n+1,8);
  let k=rand(2,4);

  let bigN=n*k;
  let bigD=d*k;

  let solution=`
    <div class="step">
      برای ساختن یک کسر مساوی، صورت و مخرج را در یک عدد یکسان ضرب می‌کنیم.
    </div>

    <div class="step">
      صورت: ${fa(n)} × ${fa(k)} = ${fa(bigN)}
    </div>

    <div class="step">
      مخرج: ${fa(d)} × ${fa(k)} = ${fa(bigD)}
    </div>

    <div class="answer">
      پس ${frac(n,d)} و ${frac(bigN,bigD)} با هم مساوی‌اند.
    </div>
  `;

  setQuestion(
    "کسر مساوی را پیدا کن.",
    `${frac(n,d)} معادل کدام کسر است؟`
  );

  makeFractionOptions(
    [bigN,bigD],
    solution,
    [
      [n+1,d+1],
      [n*2,d*3],
      [n*3,d*2]
    ]
  );
}

/* مرحله سوم: ساده کردن کسرها */

function questionSimplify(){

  let n=rand(2,8);
  let d=rand(2,8);
  let k=rand(2,5);

  n*=k;
  d*=k;

  let [sn,sd]=simplify(n,d);
  let g=gcd(n,d);

  let solution=`
    <div class="step">
      برای ساده کردن کسر، صورت و مخرج را بر یک مقسوم‌علیه مشترک تقسیم می‌کنیم.
    </div>

    <div class="step">
      بزرگ‌ترین مقسوم‌علیه مشترک ${fa(n)} و ${fa(d)} برابر ${fa(g)} است.
    </div>

    <div class="step">
      صورت: ${fa(n)} ÷ ${fa(g)} = ${fa(sn)}
    </div>

    <div class="step">
      مخرج: ${fa(d)} ÷ ${fa(g)} = ${fa(sd)}
    </div>

    <div class="answer">
      پاسخ ساده‌شده: ${frac(sn,sd)}
    </div>
  `;

  setQuestion(
    "کسر را تا حد امکان ساده کن.",
    frac(n,d)
  );

  makeFractionOptions(
    [sn,sd],
    solution,
    [
      [sn+1,sd],
      [sn,sd+1],
      [n+1,d]
    ]
  );
}

/* مرحله چهارم و پنجم: جمع و تفریق */

function questionArithmetic(type){

  let a,b,c,d;
  let same=Math.random()<0.5;

  if(same){

    b=rand(3,9);
    d=b;
    a=rand(1,b-1);
    c=rand(1,b-1);

    if(type==="subtract"){
      while(a===c){
        c=rand(1,b-1);
      }
    }

  }else{

    b=rand(3,8);

    do{
      d=rand(3,9);
    }while(d===b);

    a=rand(1,b-1);
    c=rand(1,d-1);
  }

  if(type==="subtract" && a*d<c*b){
    [a,c]=[c,a];
    [b,d]=[d,b];
  }

  let title=type==="add"?"جمع کسرها":"تفریق کسرها";
  let symbol=type==="add"?"+":"−";

  let resultN,resultD;
  let steps="";

  if(same){

    resultD=b;

    if(type==="add"){

      resultN=a+c;

      steps=`
        <div class="step">
          مخرج‌ها برابرند؛ پس مخرج را همان‌طور نگه می‌داریم.
        </div>

        <div class="step">
          صورت‌ها را جمع می‌کنیم:
          ${fa(a)} + ${fa(c)} = ${fa(resultN)}
        </div>

        <div class="step">
          مخرج بدون تغییر می‌ماند: ${fa(b)}
        </div>
      `;

    }else{

      resultN=a-c;

      steps=`
        <div class="step">
          مخرج‌ها برابرند؛ پس مخرج را همان‌طور نگه می‌داریم.
        </div>

        <div class="step">
          صورت‌ها را از هم کم می‌کنیم:
          ${fa(a)} − ${fa(c)} = ${fa(resultN)}
        </div>

        <div class="step">
          مخرج بدون تغییر می‌ماند: ${fa(b)}
        </div>
      `;
    }

  }else{

    let common=b*d;
    let newA=a*d;
    let newC=c*b;

    resultD=common;

    if(type==="add"){

      resultN=newA+newC;

      steps=`
        <div class="step">
          مخرج‌ها برابر نیستند؛ ابتدا آن‌ها را هم‌مخرج می‌کنیم.
        </div>

        <div class="step">
          کسر اول:
          ${frac(a,b)} = ${frac(newA,common)}
        </div>

        <div class="step">
          کسر دوم:
          ${frac(c,d)} = ${frac(newC,common)}
        </div>

        <div class="step">
          حالا صورت‌ها را جمع می‌کنیم:
          ${fa(newA)} + ${fa(newC)} = ${fa(resultN)}
        </div>
      `;

    }else{

      resultN=newA-newC;

      steps=`
        <div class="step">
          مخرج‌ها برابر نیستند؛ ابتدا آن‌ها را هم‌مخرج می‌کنیم.
        </div>

        <div class="step">
          کسر اول:
          ${frac(a,b)} = ${frac(newA,common)}
        </div>

        <div class="step">
          کسر دوم:
          ${frac(c,d)} = ${frac(newC,common)}
        </div>

        <div class="step">
          حالا صورت‌ها را از هم کم می‌کنیم:
          ${fa(newA)} − ${fa(newC)} = ${fa(resultN)}
        </div>
      `;
    }
  }

  let [sn,sd]=simplify(resultN,resultD);

  if(sn!==resultN || sd!==resultD){

    steps+=`
      <div class="step">
        در صورت امکان کسر را ساده می‌کنیم:
        ${frac(resultN,resultD)} = ${frac(sn,sd)}
      </div>
    `;
  }

  steps+=`
    <div class="answer">
      پاسخ نهایی: ${frac(sn,sd)}
    </div>
  `;

  setQuestion(
    title,
    `${frac(a,b)} ${symbol} ${frac(c,d)} = ؟`
  );

  makeFractionOptions(
    [sn,sd],
    steps,
    [
      [resultN+1,resultD],
      [Math.max(1,sn-1),sd],
      [sn,sd+1]
    ]
  );
}

</script>

</body>
</html>
