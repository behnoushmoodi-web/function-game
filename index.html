<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی مقایسه کسرها</title>
<style>
body {
  font-family: Tahoma, sans-serif;
  background: #fff8e9;
  text-align: center;
  padding: 20px;
  color: #35445c;
}
h1 { color: #315c81; }
.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin: 20px auto;
  max-width: 500px;
  box-shadow: 0 4px 15px #ddd;
}
.fractions {
  display: flex;
  justify-content: space-around;
  gap: 15px;
}
.fraction {
  background: #f0f5fa;
  border-radius: 15px;
  padding: 15px;
  width: 40%;
}
.number {
  font-size: 25px;
  font-weight: bold;
}
button {
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  margin: 8px;
  font-size: 18px;
  cursor: pointer;
  background: #e5b85c;
  color: #333;
}
button:hover { background: #f0ce85; }
.shape {
  display: flex;
  height: 35px;
  margin: 15px auto;
  direction: ltr;
}
.part {
  border: 1px solid white;
  background: #d9e3ed;
  flex: 1;
}
.filled { background: #55a6a0; }
#message {
  font-size: 20px;
  font-weight: bold;
  margin: 15px;
}
</style>
</head>
<body>

<h1>🎯 مسابقه مقایسه کسرها</h1>
<p>کدام کسر بزرگ‌تر است؟</p>

<div class="card">
  <div class="fractions">
    <div class="fraction">
      <div id="fraction1" class="number"></div>
      <div id="shape1" class="shape"></div>
      <button onclick="check(1)">کسر اول</button>
    </div>
    <div class="fraction">
      <div id="fraction2" class="number"></div>
      <div id="shape2" class="shape"></div>
      <button onclick="check(2)">کسر دوم</button>
    </div>
  </div>
  <div id="message"></div>
  <button onclick="newQuestion()">سؤال بعدی 🔄</button>
</div>

<script>
let a, b, c, d;

function makeFraction() {
  let denominator = Math.floor(Math.random() * 7) + 3;
  let numerator = Math.floor(Math.random() * (denominator - 1)) + 1;
  return [numerator, denominator];
}

function drawShape(id, n, d) {
  let box = document.getElementById(id);
  box.innerHTML = "";
  for(let i = 0; i < d; i++) {
    let part = document.createElement("div");
    part.className = "part" + (i < n ? " filled" : "");
    box.appendChild(part);
  }
}

function newQuestion() {
  do {
    [a,b] = makeFraction();
    [c,d] = makeFraction();
  } while(a/b === c/d);

  document.getElementById("fraction1").innerHTML = a + "<hr>" + b;
  document.getElementById("fraction2").innerHTML = c + "<hr>" + d;

  drawShape("shape1", a, b);
  drawShape("shape2", c, d);

  document.getElementById("message").innerHTML = "";
}

function check(choice) {
  let correct = a/b > c/d ? 1 : 2;
  document.getElementById("message").innerHTML =
    choice === correct ? "🌟 آفرین! پاسخ درست است." : "دوباره فکر کن! پاسخ درست نیست.";
}

newQuestion();
</script>

</body>
</html>
